# Pre-commit configuration for Admina.
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files

repos:
  # ── Generic hygiene ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Python: ruff ─────────────────────────────────────────────
  # Keep this rev in sync with the `ruff` version pinned in uv.lock so a
  # local `pre-commit run` matches CI (CI runs ruff via `uv sync --group dev`).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # ── Rust: rustfmt + clippy ───────────────────────────────────
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (core-rust)
        entry: bash -c 'cd core-rust && cargo fmt --all -- --check'
        language: system
        files: ^core-rust/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (core-rust)
        entry: bash -c 'cd core-rust && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^core-rust/.*\.(rs|toml)$
        pass_filenames: false
        stages: [pre-push]

  # ── Secret detection ─────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
