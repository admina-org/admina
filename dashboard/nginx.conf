server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────
    # Applied to every response (including reverse-proxied API
    # responses) via `always`. HSTS is set for 1 year; remove or
    # shorten if you serve the dashboard over plain HTTP.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── HTTP Basic Auth (generated at container start) ────
    # docker-entrypoint.d/90-api-key.sh writes /etc/nginx/.htpasswd from
    # ADMINA_DASHBOARD_USER (default admin) and ADMINA_DASHBOARD_PASSWORD
    # and sets the realm below to "Admina Dashboard"; with no password it
    # sets it to off, which it allows only without ADMINA_API_KEY (the
    # container does not start otherwise).
    auth_basic __AUTH_BASIC__;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── Proxy pass-through endpoints ──────────────────────
    # These MUST come before the SPA catch-all so nginx
    # doesn't serve index.html for backend routes.

    # Health check (no auth required)
    location = /health {
        auth_basic off;
        proxy_pass http://proxy:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Dashboard API: the read-only routes of the dashboard page ──
    # With ADMINA_API_KEY set, the entrypoint writes the key into the API
    # key header lines below, on these routes only. Without it, it removes
    # those lines: the page then signs in with the API key
    # (POST /api/dashboard/session), which reaches the proxy as sent.

    # WebSocket: live governance feed
    location /api/dashboard/live {
        proxy_pass http://proxy:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key "__ADMINA_API_KEY__";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/dashboard/ {
        proxy_pass http://proxy:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "__ADMINA_API_KEY__";
    }

    location = /api/stats {
        proxy_pass http://proxy:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key "__ADMINA_API_KEY__";
    }

    # ── Other API routes and the MCP endpoint ─────────────
    # Forwarded as received: the caller sends its own API key.
    location /api/ {
        proxy_pass http://proxy:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://proxy:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger / OpenAPI docs — proxy directly so Swagger UI
    # can fetch /openapi.json without path prefix issues.
    location = /docs {
        proxy_pass http://proxy:8080/docs;
        proxy_set_header Host $host;
    }
    location = /redoc {
        proxy_pass http://proxy:8080/redoc;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://proxy:8080/openapi.json;
        proxy_set_header Host $host;
    }

    # Legacy /proxy/docs links (redirect to /docs)
    location = /proxy/docs {
        return 301 /docs;
    }
    location = /proxy/openapi.json {
        return 301 /openapi.json;
    }

    # ── Vendored JS: cacheable (immutable, version in filename) ──
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── Static files (dashboard SPA) — catch-all, no cache ──
    # The dashboard HTML is small (~50 KB) and is rebuilt on every
    # release; bypass browser caching so users always see the
    # latest code without manual hard-refresh after an update.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
