name: Dependabot auto-merge

# Enable auto-merge for low-risk Dependabot PRs once CI passes.
#
# Scope (deliberately conservative):
#   - github-actions, docker, cargo: patch + minor updates auto-merge.
#     Dependabot keeps their lockfiles (Cargo.lock) in sync, so a green
#     CI run is sufficient.
#   - pip is EXCLUDED on purpose. Dependabot edits pyproject.toml but not
#     uv.lock; CI's `uv sync --frozen` still passes, so an auto-merge would
#     silently accumulate lockfile drift. pip PRs stay manual so a follow-up
#     `uv lock` can be committed (see CONTRIBUTING / the 0.9.5 release notes).
#   - major updates of any ecosystem stay manual.
#
# Requires repo setting "Allow auto-merge" (Settings → General → Pull
# Requests). With branch protection requiring status checks, GitHub merges
# the PR automatically only after all required checks are green.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b  # v2.4.0

      - name: Enable auto-merge for low-risk updates
        # Auto-merge patch + minor for actions/docker/cargo. Exclude pip
        # (uv.lock drift) and every major bump.
        if: >
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.package-ecosystem != 'pip'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
