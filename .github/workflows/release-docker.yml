name: Publish Docker images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  proxy:
    name: admina-proxy → ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: ver
        run: |
          ref="${GITHUB_REF#refs/tags/v}"
          if [ "$ref" = "$GITHUB_REF" ]; then
            ref="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$ref" >> "$GITHUB_OUTPUT"

      - name: Build & push admina-proxy
        uses: docker/build-push-action@v5
        with:
          context: .
          file: admina/proxy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/admina-proxy:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/admina-proxy:latest

  dashboard:
    name: admina-dashboard → ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: ver
        run: |
          ref="${GITHUB_REF#refs/tags/v}"
          if [ "$ref" = "$GITHUB_REF" ]; then
            ref="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$ref" >> "$GITHUB_OUTPUT"

      - name: Generate git_commit.txt for dashboard build
        run: |
          echo "${GITHUB_SHA::7}" > dashboard/git_commit.txt

      - name: Build & push admina-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/admina-dashboard:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/admina-dashboard:latest
