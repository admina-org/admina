# Admina — Benchmark Compose Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.benchmark.yml run --rm benchmark
#   docker compose -f docker-compose.yml -f docker-compose.benchmark.yml run --rm benchmark --heavy
#   docker compose -f docker-compose.yml -f docker-compose.benchmark.yml run --rm benchmark --quick


services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    container_name: admina-benchmark
    environment:
      - PROXY_URL=http://proxy:8080
      - REPORT_DIR=/app/benchmark-reports
    volumes:
      - ./benchmark-reports:/app/benchmark-reports
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - admina
